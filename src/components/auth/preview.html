<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valence Login</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #f4f7fb;
      overflow: hidden;
    }

    .login-wrapper {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* LEFT SIDE */

    .left-section {
      flex: 1.8;
      background: linear-gradient(135deg, #0f172a, #172554);
      position: relative;
      overflow: hidden;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .left-section::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .left-section::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.04);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .brand {
      z-index: 2;
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      height: 42px;
      object-fit: contain;
    }

    .hero-content {
      z-index: 2;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .hero-image {
      width: 420px;
      max-width: 90%;
      margin-bottom: 40px;
      animation: float 5s ease-in-out infinite;
    }

    .hero-image img {
      width: 100%;
      object-fit: contain;
    }

    .hero-title {
      color: white;
      font-size: 48px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      max-width: 650px;
    }

    .hero-subtitle {
      margin-top: 18px;
      color: rgba(255,255,255,0.75);
      font-size: 18px;
      text-align: center;
      max-width: 500px;
      line-height: 1.6;
    }

    /* FLOATING SVGs */

    .floating {
      position: absolute;
      z-index: 1;
      animation: floatSoft 6s ease-in-out infinite;
    }

    .floating img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .floating-1 {
      width: 80px;
      top: 22%;
      left: 24%;
    }

    .floating-2 {
      width: 90px;
      top: 30%;
      right: 20%;
      animation-delay: 1s;
    }

    .floating-3 {
      width: 85px;
      bottom: 28%;
      left: 22%;
      animation-delay: 2s;
    }

    /* RIGHT SIDE */

    .right-section {
      width: 480px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
    }

    .login-title {
      font-size: 42px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .login-subtitle {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #1e293b;
    }

    .form-input {
      width: 100%;
      height: 56px;
      border-radius: 14px;
      border: 1px solid #dbe4ee;
      background: #f8fafc;
      padding: 0 18px;
      font-size: 15px;
      transition: 0.3s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-icon {
      position: absolute;
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 24px;
    }

    .forgot-row a {
      text-decoration: none;
      color: #2563eb;
      font-size: 14px;
      font-weight: 600;
    }

    .login-btn {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.35);
    }

    .bottom-text {
      margin-top: 28px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    .bottom-text a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    @keyframes floatSoft {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    /* RESPONSIVE */

    @media (max-width: 1100px) {
      .left-section {
        display: none;
      }

      .right-section {
        width: 100%;
      }

      body {
        overflow: auto;
      }
    }

    @media (max-width: 600px) {
      .right-section {
        padding: 24px;
      }

      .login-title {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- LEFT SECTION -->

    <div class="left-section">

      <!-- BRAND -->

      <div class="brand">
        <img src="./assets/valence-logo.svg" alt="Valence Logo" />
        <img src="./assets/valence-text.svg" alt="Valence" />
      </div>

      <!-- FLOATING SVGs -->

      <div class="floating floating-1">
        <img src="./assets/dumbbell.svg" alt="" />
      </div>

      <div class="floating floating-2">
        <img src="./assets/protein.svg" alt="" />
      </div>

      <div class="floating floating-3">
        <img src="./assets/shoe.svg" alt="" />
      </div>

      <!-- HERO -->

      <div class="hero-content">

        <div class="hero-image">
          <img src="./assets/gym-hero.svg" alt="Gym Illustration" />
        </div>

        <h1 class="hero-title">
          The operating system for modern fitness clubs.
        </h1>

        <p class="hero-subtitle">
          Manage memberships, workouts, trainers, payments and your entire gym
          ecosystem from one powerful platform.
        </p>

      </div>

    </div>

    <!-- RIGHT SECTION -->

    <div class="right-section">

      <div class="login-card">

        <h1 class="login-title">
          Welcome Back
        </h1>

        <p class="login-subtitle">
          Log in to your Valence dashboard and manage your gym business seamlessly.
        </p>

        <form>

          <div class="form-group">
            <label class="form-label">
              Email Address
            </label>

            <input
              type="email"
              class="form-input"
              placeholder="Enter your email"
            />
          </div>

          <div class="form-group">
            <label class="form-label">
              Password
            </label>

            <div class="password-wrapper">

              <input
                type="password"
                class="form-input"
                placeholder="Enter your password"
              />

              <span class="password-icon">
                👁
              </span>

            </div>
          </div>

          <div class="forgot-row">
            <a href="#">
              Forgot password?
            </a>
          </div>

          <button class="login-btn">
            Log In
          </button>

        </form>

        <div class="bottom-text">
          Don’t have an account?
          <a href="#">
            Create one
          </a>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
